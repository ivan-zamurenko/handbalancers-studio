# Project-scoped baseline. Review before trusting this workspace.
# Verified against official config docs on 2026-10-06; not runtime-tested here.
model = "gpt-6-astra"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[agents]
enabled = true
max_concurrent_threads_per_session = 1

[agents.studio_reviewer]
description = "Review one Studio task diff against its acceptance cases. Read-only; no implementation or migration changes."
config_file = "agents/reviewer.toml"

# Project-only Firecrawl connection. Reuse local CLI login; no credentials in Git.
[mcp_servers.firecrawl]
url = "https://mcp.firecrawl.dev/v2/mcp"
http_headers_helper = 'python3 "$(git rev-parse --show-toplevel)/tools/firecrawl_mcp_headers.py"'
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 90
enabled_tools = ["firecrawl_scrape", "firecrawl_search", "firecrawl_parse"]
