name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  quality:
    name: Lint, format and server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The test fixture refuses any database whose name does not end in _test and
    # whose host is not local, so CI mirrors that contract instead of relaxing it.
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -e "./server[dev]"

      - name: Ruff lint
        run: ruff check server scripts

      - name: Ruff format
        run: ruff format --check server scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Prettier
        run: npx prettier --check .

      - name: Server tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/studio_test
        run: pytest -q --tb=short

      - name: Deployment tests
        run: python -m unittest discover -s deploy/tests -q

      # Generated per run so that no secret-shaped literal ever lives in Git,
      # even a throwaway one for an ephemeral database.
      - name: Generate a throwaway session secret
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Migrations match the models
        working-directory: server
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/studio_test
          APP_ENV: development
          BASE_URL: http://127.0.0.1:8000
        run: alembic upgrade head && alembic check

  browser:
    name: Browser and accessibility checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -e "./server"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chrome

      - name: Generate a throwaway session secret
        run: echo "SESSION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # The preview endpoints the browser scripts rely on stay disabled unless
      # LOCAL_PREVIEW is set, and it is only accepted on a loopback BASE_URL.
      - name: Start the application
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/studio
          APP_ENV: development
          LOCAL_PREVIEW: 'true'
          BASE_URL: http://127.0.0.1:8000
        working-directory: server
        run: |
          alembic upgrade head
          nohup python -m uvicorn studio.main:app --host 127.0.0.1 --port 8000 --no-access-log > "${RUNNER_TEMP}/uvicorn.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health/ready > /dev/null; then
              echo "Application is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become ready in time"
          cat "${RUNNER_TEMP}/uvicorn.log"
          exit 1

      - name: Site and accessibility checks
        run: node scripts/check-site.mjs

      - name: Account flow checks
        run: node scripts/check-account-flow.mjs

      - name: Upload application log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uvicorn-log
          path: ${{ runner.temp }}/uvicorn.log
          if-no-files-found: ignore
