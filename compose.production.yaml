# This is a standalone file, not an override of compose.yaml.
name: handbalancers-studio-production

x-app: &app
  build:
    context: .
    dockerfile: server/Dockerfile
  image: handbalancers-studio:production
  environment:
    DATABASE_URL: postgresql+psycopg://studio:${APP_DATABASE_PASSWORD:?An app database password is required}@db:5432/${APP_DATABASE_NAME:-studio}
    SESSION_SECRET: ${SESSION_SECRET:?A random session secret is required}
    APP_ENV: production
    LOCAL_PREVIEW: "false"
    BASE_URL: https://${STUDIO_HOST:?A public DNS hostname is required}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    STRIPE_PRICE_ESSENTIAL: ${STRIPE_PRICE_ESSENTIAL:-}
    STRIPE_PRICE_PLUS: ${STRIPE_PRICE_PLUS:-}
    STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
    STRIPE_PRICE_PRO_PLUS: ${STRIPE_PRICE_PRO_PLUS:-}
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?A separate database admin password is required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?An app database password is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/10-create-app.sql:/docker-entrypoint-initdb.d/10-create-app.sql:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"

  api:
    <<: *app
    # Only the nginx address can supply trusted forwarded headers.
    command: [uvicorn, studio.main:app, --host, 0.0.0.0, --port, "8000", --no-access-log, --proxy-headers, --forwarded-allow-ips, 172.30.100.10]
    networks: [data, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  nginx:
    image: nginx:1.30.4-alpine
    entrypoint: [/bin/sh, /opt/studio/start-nginx.sh]
    environment:
      STUDIO_HOST: ${STUDIO_HOST:?A public DNS hostname is required}
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx:/opt/studio:ro
      - certificates:/etc/letsencrypt:ro
      - acme-webroot:/var/www/certbot:ro
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=1m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    networks:
      edge:
        ipv4_address: 172.30.100.10
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null --header="Host: $$STUDIO_HOST" http://127.0.0.1/_proxy/live']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    restart: unless-stopped

  certbot:
    image: certbot/certbot:v5.8.0
    profiles: [tools]
    environment:
      STUDIO_HOST: ${STUDIO_HOST:?A public DNS hostname is required}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - certificates:/etc/letsencrypt
      - acme-webroot:/var/www/certbot
      - certbot-work:/var/lib/letsencrypt
    networks: [edge]
    logging: *logging

volumes:
  postgres-data:
  certificates:
  acme-webroot:
  certbot-work:

networks:
  data:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.30.100.0/24
