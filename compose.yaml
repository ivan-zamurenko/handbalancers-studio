name: handbalancers-studio-local

x-app: &app
  build:
    context: .
    dockerfile: server/Dockerfile
  image: handbalancers-studio:local
  environment: &app-environment
    DATABASE_URL: postgresql+psycopg://studio:${APP_DATABASE_PASSWORD:?Create a private Compose env file}@db:5432/${APP_DATABASE_NAME:-studio}
    SESSION_SECRET: ${SESSION_SECRET:?A random session secret is required}
    APP_ENV: development
    # Demo auth requires a true loopback peer; use native local.py for that flow.
    LOCAL_PREVIEW: 'false'
    BASE_URL: http://127.0.0.1:8000
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
    APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
    STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    STRIPE_PRICE_ESSENTIAL: ${STRIPE_PRICE_ESSENTIAL:-}
    STRIPE_PRICE_PLUS: ${STRIPE_PRICE_PLUS:-}
    STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
    STRIPE_PRICE_PRO_PLUS: ${STRIPE_PRICE_PRO_PLUS:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?A separate database admin password is required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?An app database password is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/10-create-app.sql:/docker-entrypoint-initdb.d/10-create-app.sql:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: 'no'

  api:
    <<: *app
    ports:
      - 127.0.0.1:8000:8000
    networks: [data, egress]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  data:
    internal: true
  egress:
