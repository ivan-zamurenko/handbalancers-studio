user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_header_timeout 10s;
    client_body_timeout 10s;
    client_max_body_size 64k;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    # Never log OAuth query parameters, cookies, request bodies or referers.
    log_format minimal '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent';
    access_log /dev/stdout minimal;
    resolver 127.0.0.11 valid=10s ipv6=off;
    # Bound anonymous session creation and login attempts per source address.
    limit_req_zone $binary_remote_addr zone=studio_session:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=studio_auth:10m rate=10r/m;
    limit_req_status 429;
    include /etc/nginx/conf.d/*.conf;
}
