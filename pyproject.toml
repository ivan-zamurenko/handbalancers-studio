[project]
name = "handbalancers-studio"
version = "0.1.0"
description = "Handbalancer's Studio — Execution V4"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.0",
    "cryptography==50.0.2",
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "psycopg[binary]==3.3.6",
    "pydantic==2.13.5",
    "pyjwt==2.15.1",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.10",
]

[tool.uv]
required-version = "==0.12.23"

[tool.uv.build-backend]
module-name = "studio"
module-root = "server"

[tool.pytest.ini_options]
testpaths = ["tools/tests", "server/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
