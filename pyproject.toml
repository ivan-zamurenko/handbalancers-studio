[project]
name = "handbalancers-studio"
version = "0.1.0"
description = "Handbalancer's Studio — Execution V4"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.uv]
required-version = "==0.12.23"

[tool.uv.build-backend]
module-name = "studio"
module-root = "server"

[tool.pytest.ini_options]
testpaths = ["tools/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
