<script>const q=new URLSearchParams(location.search);

const paths={home:'M3 10 12 3l9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z',plan:'M5 4h14v17H5z M9 4V2m6 2V2M8 9h8m-8 4h8m-8 4h5',training:'M3 9v6m3-9v12m12-12v12m3-9v6M6 12h12',history:'M3 11a9 9 0 1 1 2 7M3 4v7h7m2-4v5l3 2',user:'M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 21v-2a8 8 0 0 1 16 0v2',search:'M20 20l-5-5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z',arrow:'M4 12h16m-6-6 6 6-6 6',check:'m5 12 4 4L19 6',video:'m9 6 9 6-9 6Z',link:'M14 4h6v6m0-6L10 14M9 4H4v16h16v-5',mail:'M3 5h18v14H3z m0 0 9 8 9-8',lock:'M6 11h12v10H6z M8 11V7a4 4 0 0 1 8 0v4',clock:'M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-5v6l3 2',chart:'M4 3v17h17M7 15l5-5 4 2 5-6'};
function icon(n){return `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.home}"/></svg>`}function button(text,primary=false,extra=''){return `<button type="button" class="${primary?'primary':''} ${extra}" data-demo>${text}</button>`}function pill(t,c=''){return `<span class="pill ${c}">${t}</span>`}function avatar(t='ОК'){return `<span class="avatar">${t}</span>`}
function days(){return `<div class="days">${[['Нд','27'],['Пн','28','done'],['Вт','29'],['Ср','30','done'],['Чт','1'],['Пт','2','today'],['Сб','3']].map(([d,n,c])=>`<div class="day ${c||''}"><span>${d}</span><strong>${n}</strong></div>`).join('')}</div>`}
function week(){return `<section class="panel week-card"><div class="row between"><h3>Ваш тиждень</h3><span class="small">2 із 3 занять</span></div><div class="week-metrics"><div class="ring"><svg viewBox="0 0 104 104" aria-hidden="true"><circle class="track" cx="52" cy="52" r="45" fill="none" stroke-width="4"/><circle class="meter" cx="52" cy="52" r="45" fill="none" stroke-width="4"/></svg><div class="ring-label">90<small>хвилин</small></div></div><div class="stack tight"><div class="big">90 <span class="muted" style="font-size:18px;letter-spacing:0">/ 135 хв</span></div><p class="small">Два заняття вже позаду.<br>Наступне — сьогодні.</p></div></div>${days()}</section>`}

function coachNote(){return `<section class="panel coach-card"><div class="row between"><h3>Коментар тренера</h3>${pill('30 вересня')}</div><p class="quote">«На наступному занятті залишаємо той самий план. Після контрольного відео разом визначимо наступний крок.»</p><div class="row between"><span class="small">До заняття «Опора і контроль»</span>${icon('arrow')}</div></section>`}
function spark(){return `<svg class="spark" viewBox="0 0 460 126" role="img" aria-label="Демонстраційні результати: тривалість контрольного підходу 18, 21, 20, 25 секунд"><path class="grid" d="M12 20H448M12 60H448M12 100H448"/><path class="data" d="M20 88 157 60 294 69 430 29"/><circle cx="20" cy="88" r="3"/><circle cx="157" cy="60" r="3"/><circle cx="294" cy="69" r="3"/><circle cx="430" cy="29" r="3"/></svg>`}
function stats(){return `<div class="statline"><div><span class="small">Заняття цього тижня</span><div class="value">2 <span class="muted" style="font-size:15px">/ 3</span></div></div><div><span class="small">Час практики</span><div class="value">90 <span class="muted" style="font-size:15px">хв</span></div></div><div><span class="small">Відео до заняття</span><div class="value">1 <span class="muted" style="font-size:15px">/ 2</span></div></div></div>`}
function setTable(){return `<table class="table"><thead><tr><th>Підхід</th><th>План</th><th>Факт</th><th>Стан</th></tr></thead><tbody>${[1,2,3,4].map((n,i)=>`<tr><td>${String(n).padStart(2,'0')}</td><td>25 с</td><td>${[25,25,23,20][i]} с</td><td><span class="accent">Записано</span></td></tr>`).join('')}</tbody></table>`}

function reviewPane(){return `<aside class="panel review-pane"><div class="row between"><h3>Ваша перевірка</h3>${pill('Чернетка')}</div><p class="small">Заняття · 30 вересня<br>Підйом плечей біля стіни</p>${video()}<div><label class="field-label" for="feedback">Коментар клієнту<small>З’явиться після публікації перевірки.</small></label><textarea id="feedback">На наступному занятті залишаємо той самий план. Після контрольного відео разом визначимо наступний крок.</textarea></div><div class="row" style="gap:9px">${icon('lock')}<button class="button-link muted" data-demo>Приватна нотатка — лише для вас</button></div>${button('Опублікувати перевірку '+icon('check'),true,'full')}<span class="small">Публікація коментаря не змінює програму.</span></aside>`}

function coachMain(){return `<div class="coach-main"><div class="row between"><div class="row">${avatar()}<div><h2 style="font-size:25px">Олексій К.</h2><p class="small" style="margin-top:5px">Опора і контроль · тиждень 04</p></div></div>${pill('Pro','good')}</div><div class="tabs"><button class="selected" data-demo>Огляд</button><button data-demo>Заняття</button><button data-demo>Програма</button><button data-demo>Оцінювання</button></div>${stats()}<section><div class="row between"><h3>Контрольний підхід</h3><span class="small">секунди</span></div><p class="small" style="margin-top:8px">Та сама вправа · та сама сторона · 4 заняття</p>${spark()}<div class="row between small"><span>21 вер.</span><span>30 вер.</span></div></section><section class="session-summary"><div class="row between"><h3>Підйом плечей біля стіни</h3>${pill('Виконано','good')}</div>${setTable()}</section><p class="small">Числовий прогрес не є оцінкою техніки.</p></div>`}

function clientThree(){return `<div class="focus-layout"><section class="focus-card"><div class="row between"><span class="eyebrow">Вправа 01 / 06</span>${pill('Підхід 3 із 4')}</div><h2>Підйом плечей<br>біля стіни</h2><p class="small">План · 4 підходи по 25 секунд · відпочинок 60 с</p><div class="focus-timer"><strong>25</strong><span>секунд</span></div><div class="set-chips"><span class="set-chip done">1 · 25 с ✓</span><span class="set-chip done">2 · 25 с ✓</span><span class="set-chip current">3</span><span class="set-chip">4</span></div><hr class="rule"><label class="field-label" for="actual">Ваш фактичний результат, секунди</label><div class="focus-control"><input class="number" type="number" id="actual" min="0" value="25">${button('Записати підхід '+icon('check'),true)}</div><div class="row between"><span class="small">Підходи 1–2 збережені</span><button class="button-link" data-demo>Пропустити підхід</button></div></section><div class="focus-details"><div class="stack tight"><h3>Зараз — лише цей підхід.</h3><p class="small">Демонстраційний екран активної практики. Інструкція та відео відкриваються окремо, не відсуваючи поле результату.</p></div>${video()}<div class="panel stack tight"><h3>Після цього</h3><p class="small">Ще один підхід, потім відтискання від підлоги.</p><div class="row between" style="padding-top:12px"><span class="small">Час заняття</span><strong style="font-size:20px;font-weight:500;font-variant-numeric:tabular-nums">12:40</strong></div>${button('Пауза',false,'full')}</div><div class="small">Немає відео? Заняття можна завершити. Техніка залишиться неперевіреною.</div></div></div>`}
function coachOne(){return `<div class="mobile-switcher"><div class="row between"><strong>Олексій К.</strong><span class="small">30 вересня</span></div><div class="mobile-segments"><button data-pane="clients">Клієнти</button><button data-pane="data">Дані</button><button data-pane="review">Перевірка</button></div></div><div class="coach-columns">${queue()}${coachMain()}${reviewPane()}</div>`}

const humanNote=coachNote;
coachNote=function(){
 if(tier==='Essential')return `<section class="panel coach-card"><h3>${UI.essentialTitle}</h3><p class="quote">${UI.essentialText}</p><p class="small">${UI.testOptional}</p></section>`;
 if(tier==='Plus')return `<section class="panel coach-card"><div class="row between"><h3>${UI.aiTitle}</h3>${pill('Plus')}</div><p class="quote">${UI.aiText}</p><p class="small">${UI.aiDemo}</p></section>`;
 return humanNote();
};
function themeControl(){return `<label class="theme-control"><span>${UI.theme}</span><select data-appearance aria-label="${UI.theme}"><option value="auto">${UI.auto}</option><option value="light">${UI.light}</option><option value="dark">${UI.dark}</option></select></label>`;}
function render(){
 role=screen==='A1'?'coach':'client';variant=screen==='C3'?3:1;
 document.body.dataset.screen=screen;
 document.body.dataset.variant=variant;
 document.body.dataset.role=role;
 document.body.dataset.mobilePanel='review';
 document.body.classList.toggle('coach-page',role==='coach');
 document.querySelector('#screen').value=screen;
 document.querySelector('#tier').value=tier;
 document.querySelector('#tier').disabled=screen!=='C1';
const coach=role==='coach';const nav=coach?[['home','Огляд'],['user','Клієнти'],['mail','Перевірки'],['plan','Програми'],['training','Вправи']]:[['home','Сьогодні'],['plan','Моя програма'],['training','Бібліотека'],['history','Історія'],['chart','Прогрес']];
const titles=coach?['','Робочий простір','Перевірка без зайвого','Одна перевірка. Повна увага.','Тиждень студії','Історія клієнта']:['','Час для вашої практики.','Ваша практика. По суті.','Опора. Контроль. Практика.','Ваш посильний тиждень.','Ваша практика триває.'];
const clientViews=[null,clientOne,clientOne,clientThree,clientOne,clientOne],coachViews=[null,coachOne,coachOne,coachOne,coachOne,coachOne];
document.querySelector('#app').innerHTML=`<div class="demo-line"><span>HAND BALANCER’S STUDIO / ${(screen==='A1'?'Classic Focus':screen==='C3'?'Practice Mode':'Classic Focus').toUpperCase()} / ${coach?'COACH':'MEMBER'}</span><span>Демонстраційні дані · не підключено до продукту</span></div><div class="shell"><aside class="sidebar"><div class="row" style="gap:12px"><div class="brand">h<span>.</span></div><div class="brand-name">Handbalancer’s<br>Studio</div></div><nav aria-label="Головна навігація">${nav.map((a,i)=>`<button data-demo class="nav-item ${i===(coach?1:0)?'active':''}">${icon(a[0])}${a[1]}</button>`).join('')}</nav><div class="account"><div class="row" style="gap:10px">${avatar(coach?'Т':'ОК')}<div><div style="font-size:12px">${coach?'Кабінет тренера':'Олексій К.'}</div><div class="small" style="font-size:11px">${coach?'Одна студія':tier+' · профіль'}</div></div></div></div></aside><div class="workspace"><header class="appbar"><div class="brand">h<span>.</span></div><div class="path">Ваша студія <span style="padding:0 12px">/</span> ${coach?'Супровід клієнтів':variant===3?'Тренування':'Сьогодні'}</div><div class="row appbar-actions"><span class="small"><span class="dot" style="margin-right:7px"></span>${coach?'Особистий супровід':'Активна підписка'}</span>${themeControl()}<span class="small" style="padding-left:4px">UA</span></div></header><main class="content"><div class="pagehead"><div><div class="eyebrow">${coach?'Ваші клієнти. Ваша увага.':'П’ятниця, 2 жовтня · демонстраційна дата'}</div><h1>${titles[variant]}</h1><p>${coach?'Історія, план і ваша перевірка — без змішування даних.':variant===3?'Збережіть фактичний результат перед наступним підходом.':'Зрозумілий наступний крок, без зайвого шуму.'}</p></div>${coach?button('Програми '+icon('arrow')):pill('Тиждень 04')}</div>${(coach?coachViews:clientViews)[variant]()}<footer class="footnote"><span>Синтетичний макет · не справжні клієнти чи результати</span><span>h. Studio / ${coach?'Coach':'Member'}</span></footer></main></div></div><nav class="mobile-nav" aria-label="Мобільна навігація">${(coach?[['user','Клієнти'],['mail','Перевірки'],['plan','Програми'],['user','Профіль']]:[['home','Сьогодні'],['plan','Програма'],['history','Історія'],['user','Профіль']]).map((a,i)=>`<button data-demo class="${i===0?'active':''}">${icon(a[0])}${a[1]}</button>`).join('')}</nav>`;

 document.querySelectorAll('[data-demo]').forEach(b=>{if(b.textContent.trim().startsWith(UI.start)){b.removeAttribute('data-demo');b.dataset.screenlink='C3';}});
 if(screen==='C3'){
   const path=document.querySelector('.appbar .path');
   path.innerHTML=`<button class="button-link back-link" data-screenlink="C1">${UI.back}</button>`;
   const timer=document.querySelector('.focus-timer');
   timer.insertAdjacentHTML('beforebegin',`<span class="small">${UI.target}</span>`);
 }
 window.appearance.setLocked(screen==='C3');
 window.appearance.syncControls();
 document.querySelectorAll('[data-pane]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pane==='review')));
}
function navigate(next){screen=next;render();window.scrollTo(0,0);}
document.querySelector('#screen').addEventListener('change',e=>navigate(e.target.value));
document.querySelector('#tier').addEventListener('change',e=>{tier=e.target.value;render();});
let toastTimeout;
document.addEventListener('click',e=>{
 const link=e.target.closest('[data-screenlink]');if(link){navigate(link.dataset.screenlink);return;}
 const pane=e.target.closest('[data-pane]');
 if(pane){document.body.dataset.mobilePanel=pane.dataset.pane;document.querySelectorAll('[data-pane]').forEach(b=>b.setAttribute('aria-pressed',String(b===pane)));return;}
 if(e.target.closest('[data-demo]')){const t=document.querySelector('#toast');t.textContent=UI.demo;t.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.hidden=true,2800);}
});
render();
</script></body></html>
