[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "handbalancers-studio"
version = "0.1.0"
description = "Handbalancer's Studio onboarding and membership server"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.40,<2.1", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3", "jinja2>=3.1.6,<4",
  "authlib>=1.6.4,<2", "httpx>=0.28,<1", "python-multipart>=0.0.20,<1",
  "stripe>=12,<15", "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires an explicitly configured local TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
