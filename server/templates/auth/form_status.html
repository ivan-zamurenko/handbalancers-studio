<p id="auth-status" class="auth-status" data-auth-status role="status" aria-live="polite" aria-atomic="true" tabindex="-1"
  data-error="{{ copy('Не вдалося завершити запит. Спробуйте ще раз.', 'We could not complete the request. Please try again.') }}"
  data-invalid="{% if auth_action == 'login' %}{{ copy('Не вдалося увійти. Перевірте email і пароль та підтвердьте пошту, якщо ще цього не зробили.', 'Unable to sign in. Check your email and password, and confirm your email if you have not yet done so.') }}{% elif auth_action == 'verify' %}{{ copy('Код неправильний, прострочений або вже використаний. Перевірте email та код або запросіть новий.', 'The code is incorrect, expired or already used. Check your email and code, or request a new one.') }}{% else %}{{ copy('Перевірте заповнені поля. Пароль має містити щонайменше 8 символів.', 'Check the form fields. Your password must contain at least 8 characters.') }}{% endif %}"
  data-limited="{{ copy('Забагато спроб. Зачекайте хвилину й повторіть.', 'Too many attempts. Wait a minute and try again.') }}"
  data-sent="{{ copy('Якщо підтвердження доступне, ми надіслали новий код. Перевірте вхідні та спам.', 'If confirmation is available, we sent a new code. Check your inbox and spam folder.') }}"></p>
