    {% if 'google' in oauth_providers %}
    <div class="login-divider">{{ copy('або увійдіть через', 'or continue with') }}</div>
    <div class="oauth-options" aria-label="{{ copy('Інші способи входу', 'Other sign-in methods') }}">
      <button class="oauth-button oauth-button--google" type="button" data-oauth-provider="google" aria-label="{{ copy('Продовжити з Google', 'Continue with Google') }}" title="{{ copy('Продовжити з Google', 'Continue with Google') }}" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2.1H12v4h5.4a4.6 4.6 0 0 1-2 3v2.6h3.2c1.9-1.8 3-4.4 3-7.5Z"/><path fill="#34A853" d="M12 22c2.7 0 5-0.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.4 14a6 6 0 0 1 0-4V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14Z"/><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.9 5.4L6.4 10C7.2 7.7 9.4 5.9 12 5.9Z"/></svg>
      </button>
    </div>
    <p id="oauth-message" class="small" role="status" tabindex="-1" data-error="{{ copy('Не вдалося почати вхід. Спробуйте пізніше.', 'Unable to start sign-in. Please try later.') }}" data-pending="{{ copy('Перенаправляємо…', 'Redirecting…') }}"></p>
    {% endif %}
